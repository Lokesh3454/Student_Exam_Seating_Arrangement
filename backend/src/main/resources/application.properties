# ===================================================================
# Application Configuration
# Smart Exam Hall Seating Arrangement System
# ===================================================================

spring.application.name=smart-exam-seating-backend
server.port=8080

# ===================================================================
# Database Configuration (MySQL)
# NOTE: Update username and password according to your local MySQL installation
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/exam_seating_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Lokesh@3454}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# 'update' automatically creates/updates tables matching the Entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 6 auto-detects MySQL dialect from JDBC metadata
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration (for Phase 2 Auth)
# ===================================================================
# 256-bit secret key in hex format
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours in milliseconds (86400000 ms)
app.jwt.expiration-ms=86400000

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.exam.seating=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
