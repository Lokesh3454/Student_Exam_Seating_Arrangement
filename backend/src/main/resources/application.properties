# ===================================================================
# Application Configuration
# Smart Exam Hall Seating Arrangement System
# ===================================================================

spring.application.name=smart-exam-seating-backend
server.port=${PORT:8080}

# ===================================================================
# Database Configuration
# - Default: Fast embedded in-memory database with MySQL compatibility mode
#   (Ensures zero-setup instant deployment on Render / Docker)
# - Cloud: Override with SPRING_DATASOURCE_URL for external MySQL (Aiven, TiDB, etc.)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:exam_seating_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false
# Do not run raw MySQL scripts on embedded DB since Hibernate ddl-auto and SecurityDataInitializer handle seeding
spring.sql.init.mode=never

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.exam.seating=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
